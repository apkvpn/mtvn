name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-release-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Build old-device APK 1.0.0+36
        working-directory: source
        run: flutter build apk --release --split-per-abi --target-platform android-arm

      - name: Upload old-device APK
        uses: actions/upload-artifact@v4
        with:
          name: manoto-vpn-v36-armeabi-v7a
          path: source/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14
